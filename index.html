<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>浅茉成长工作台</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
</head>
<body>
  <div id="app">
    <!-- 背景装饰贴纸 -->
    <svg class="sticker-bg sticker-cloud1" width="80" height="50" viewBox="0 0 80 50">
      <ellipse cx="35" cy="32" rx="28" ry="14" fill="#BAE1F2"/>
      <ellipse cx="48" cy="28" rx="22" ry="16" fill="#BAE1F2"/>
      <ellipse cx="25" cy="28" rx="18" ry="12" fill="#BAE1F2"/>
    </svg>
    <svg class="sticker-bg sticker-cloud2" width="64" height="40" viewBox="0 0 64 40">
      <ellipse cx="28" cy="24" rx="22" ry="12" fill="#C4B5FD"/>
      <ellipse cx="38" cy="22" rx="18" ry="13" fill="#C4B5FD"/>
      <ellipse cx="20" cy="22" rx="14" ry="10" fill="#C4B5FD"/>
    </svg>
    <svg class="sticker-bg sticker-cloud3" width="60" height="36" viewBox="0 0 60 36">
      <ellipse cx="26" cy="22" rx="20" ry="10" fill="#FADCE8"/>
      <ellipse cx="36" cy="20" rx="16" ry="12" fill="#FADCE8"/>
    </svg>
    <svg class="sticker-bg sticker-star1" width="36" height="36" viewBox="0 0 36 36">
      <polygon points="18,3 22,13 33,15 25,23 27,33 18,28 9,33 11,23 3,15 14,13" fill="#F9E79F"/>
    </svg>
    <svg class="sticker-bg sticker-star2" width="28" height="28" viewBox="0 0 28 28">
      <polygon points="14,2 17,10 26,12 19,18 21,26 14,22 7,26 9,18 2,12 11,10" fill="#F9E79F"/>
    </svg>
    <svg class="sticker-bg sticker-star3" width="32" height="32" viewBox="0 0 32 32">
      <polygon points="16,2 19,11 29,13 21,19 23,29 16,24 9,29 11,19 3,13 13,11" fill="#F9E79F"/>
    </svg>
    <svg class="sticker-bg sticker-heart1" width="40" height="40" viewBox="0 0 40 40">
      <path d="M20,34 C10,24 3,18 3,12 C3,7 7,3 12,3 C15,3 18,5 20,8 C22,5 25,3 28,3 C33,3 37,7 37,12 C37,18 30,24 20,34Z" fill="#F8A5C2"/>
    </svg>
    <svg class="sticker-bg sticker-heart2" width="30" height="30" viewBox="0 0 30 30">
      <path d="M15,26 C7,18 2,13 2,9 C2,5 5,2 9,2 C11,2 13,3 15,6 C17,3 19,2 21,2 C25,2 28,5 28,9 C28,13 23,18 15,26Z" fill="#C4B5FD"/>
    </svg>
    <svg class="sticker-bg sticker-flower1" width="42" height="42" viewBox="0 0 42 42">
      <circle cx="21" cy="12" r="6" fill="#F8A5C2"/>
      <circle cx="12" cy="21" r="6" fill="#F8A5C2"/>
      <circle cx="30" cy="21" r="6" fill="#F8A5C2"/>
      <circle cx="21" cy="30" r="6" fill="#F8A5C2"/>
      <circle cx="21" cy="21" r="5" fill="#FADCE8"/>
    </svg>
    <svg class="sticker-bg sticker-flower2" width="34" height="34" viewBox="0 0 34 34">
      <circle cx="17" cy="10" r="5" fill="#C4B5FD"/>
      <circle cx="10" cy="17" r="5" fill="#C4B5FD"/>
      <circle cx="24" cy="17" r="5" fill="#C4B5FD"/>
      <circle cx="17" cy="24" r="5" fill="#C4B5FD"/>
      <circle cx="17" cy="17" r="4" fill="#BAE1F2"/>
    </svg>

    <!-- ============ 左侧导航栏 ============ -->
    <nav class="sidebar">
      <div class="sidebar-header">
        <div class="logo-icon">
          <svg viewBox="0 0 48 48" width="40" height="40">
            <circle cx="24" cy="24" r="22" fill="#EDE9FE" opacity="0.6"/>
            <path d="M24 10 L34 18 L34 34 Q34 37 31 37 L17 37 Q14 37 14 34 L14 18 Z" fill="#C4B5FD"/>
            <path d="M24 10 L34 18 L34 34 Q34 37 31 37 L17 37 Q14 37 14 34 L14 18 Z" fill="none" stroke="#A78BFA" stroke-width="1.5"/>
            <circle cx="24" cy="25" r="4" fill="#fff"/>
            <path d="M22 25 Q24 28 26 25" fill="none" stroke="#F8A5C2" stroke-width="1.5" stroke-linecap="round"/>
            <circle cx="21.5" cy="23.5" r="1" fill="#F8A5C2"/>
            <circle cx="26.5" cy="23.5" r="1" fill="#F8A5C2"/>
          </svg>
        </div>
        <div class="logo-text">
          <span class="logo-title">浅茉</span>
          <span class="logo-sub">成长工作台</span>
        </div>
        <button class="sidebar-close" id="sidebarCloseBtn" aria-label="关闭侧栏">
          <svg viewBox="0 0 24 24" width="20" height="20">
            <path d="M18 6L6 18M6 6l12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>
      </div>

      <div class="mode-toggle" id="modeToggle">
        <button class="mode-btn active" data-mode="daily">每日重置</button>
        <button class="mode-btn" data-mode="cumulative">累积记录</button>
      </div>

      <ul class="nav-list" id="navList">
        <!-- 导航项由 JS 动态生成 -->
      </ul>

      <div class="sidebar-footer">
        <div class="streak-badge" id="streakBadge">
          <svg viewBox="0 0 24 24" width="20" height="20"><path d="M12 2 C13 6 16 7 16 12 C16 15 14 17 12 17 C10 17 8 15 8 12 C8 9 10 8 10 5 Z" fill="#F5B041"/><path d="M12 17 L12 22" stroke="#F5B041" stroke-width="2" stroke-linecap="round"/></svg>
          <span>连续打卡 <strong id="streakCount">0</strong> 天</span>
        </div>
      </div>
    </nav>

    <!-- ============ 移动端顶部条 ============ -->
    <div class="mobile-topbar" id="mobileTopbar">
      <button class="hamburger-btn" id="hamburgerBtn" aria-label="菜单">
        <svg viewBox="0 0 24 24" width="22" height="22">
          <path d="M3 6h18M3 12h18M3 18h18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
      <div class="mobile-logo">
        <svg viewBox="0 0 48 48" width="28" height="28">
          <circle cx="24" cy="24" r="22" fill="#EDE9FE" opacity="0.6"/>
          <path d="M24 10 L34 18 L34 34 Q34 37 31 37 L17 37 Q14 37 14 34 L14 18 Z" fill="#C4B5FD"/>
          <path d="M24 10 L34 18 L34 34 Q34 37 31 37 L17 37 Q14 37 14 34 L14 18 Z" fill="none" stroke="#A78BFA" stroke-width="1.5"/>
          <circle cx="24" cy="25" r="4" fill="#fff"/>
          <circle cx="21.5" cy="23.5" r="1" fill="#F8A5C2"/>
          <circle cx="26.5" cy="23.5" r="1" fill="#F8A5C2"/>
        </svg>
        <span>浅茉</span>
      </div>
      <div class="mobile-topbar-actions">
        <div class="mobile-streak" id="mobileStreak">
          <svg viewBox="0 0 24 24" width="16" height="16"><path d="M12 2 C13 6 16 7 16 12 C16 15 14 17 12 17 C10 17 8 15 8 12 C8 9 10 8 10 5 Z" fill="#F5B041"/></svg>
          <strong id="mobileStreakCount">0</strong>
        </div>
        <div class="mode-toggle" id="mobileModeToggle">
          <button class="mode-btn active" data-mode="daily">日</button>
          <button class="mode-btn" data-mode="cumulative">累</button>
        </div>
      </div>
    </div>

    <!-- ============ 侧栏遮罩 ============ -->
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

    <!-- ============ 右侧主内容区 ============ -->
    <main class="main-content" id="mainContent">
      <div class="content-inner" id="contentInner">
        <!-- 各视图由 JS 渲染 -->
      </div>
    </main>
  </div>

  <!-- Toast 提示 -->
  <div class="toast" id="toast"></div>

  <script src="app.js"></script>
</body>
</html>
